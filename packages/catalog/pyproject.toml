[project]
name = "modelith-catalog"
version = "0.1.0"
description = "Modelith cross-repo model catalog: base-tier discovery, decoupled from governance"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["modelith-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdl_catalog"]

[tool.uv.sources]
modelith-core = { workspace = true }
