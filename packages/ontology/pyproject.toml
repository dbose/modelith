[project]
name = "modelith-ontology"
version = "0.1.0"
description = "Modelith ontology stack: generic vocabulary registry, IRI resolution, SHACL, RDF export"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "modelith-core",
    "rdflib>=7.0",
    "pyshacl>=0.25",
    "httpx>=0.27",  # ontology fetch: artifact download + SPARQL endpoint export
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdl_ontology"]

[tool.uv.sources]
modelith-core = { workspace = true }
