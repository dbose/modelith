[project]
name = "modelith-ontology"
version = "0.1.0"
description = "Modelith ontology stack: generic vocabulary registry, IRI resolution, SHACL, RDF export"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "modelith-core",
    # RDF backend: pyoxigraph (Rust/PyO3, zero Python transitive deps, CVE-clean, a
    # different PyPI coordinate a name-matching enterprise firewall does not quarantine —
    # unlike rdflib). All RDF I/O goes through the mdl_ontology._rdf adapter; nothing else
    # in this package imports the backend directly (enforced by a boundary guard test).
    "pyoxigraph>=0.5.9",
    "httpx>=0.27",  # ontology fetch: artifact download + remote SPARQL CONSTRUCT
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdl_ontology"]

[tool.uv.sources]
modelith-core = { workspace = true }
