[project]
name = "modelith-emit-dbt"
version = "0.1.0"
description = "Modelith dbt-core project emitter with protected regions and platform adapters"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["modelith-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdl_emit_dbt"]

[tool.uv.sources]
modelith-core = { workspace = true }
