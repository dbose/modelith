[project]
name = "modelith-reverse"
version = "0.1.0"
description = "Modelith reverse engineering + drift detection (dbt manifest/catalog)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "modelith-core",
    "dbt-artifacts-parser>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdl_reverse"]

[tool.uv.sources]
modelith-core = { workspace = true }
