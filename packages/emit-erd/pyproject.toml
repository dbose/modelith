[project]
name = "modelith-emit-erd"
version = "0.1.1"
description = "Modelith ER interchange emitters: SQL DDL, Mermaid erDiagram, DBML"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["modelith-core", "modelith-emit-dbt", "sqlglot>=25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdl_emit_erd"]

[tool.uv.sources]
modelith-core = { workspace = true }
modelith-emit-dbt = { workspace = true }
