[project]
name = "modelith-server"
version = "0.1.0"
description = "Modelith read API for the canvas (spec §13.5: serves the canvas, does not own state)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "modelith-core",
    "modelith-ontology",
    "modelith-reverse",
    "modelith-emit-erd",
    "modelith-emit-contract",
    "modelith-emit-graph",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.18",
]

[project.optional-dependencies]
# OpenTelemetry export for the audit log (spec §20). Optional so the core CLI stays
# dependency-light; without it, audit degrades to the local JSONL file writer alone.
audit = [
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp-proto-http>=1.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdl_server"]
artifacts = ["src/mdl_server/static"]

[tool.uv.sources]
modelith-core = { workspace = true }
modelith-ontology = { workspace = true }
modelith-reverse = { workspace = true }
modelith-emit-erd = { workspace = true }
modelith-emit-contract = { workspace = true }
modelith-emit-graph = { workspace = true }
