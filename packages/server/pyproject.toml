[project]
name = "modelith-server"
version = "0.1.0"
description = "Modelith read API for the canvas (spec §13.5: serves the canvas, does not own state)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "modelith-core",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdl_server"]
artifacts = ["src/mdl_server/static"]

[tool.uv.sources]
modelith-core = { workspace = true }
