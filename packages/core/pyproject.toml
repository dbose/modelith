[project]
name = "modelith-core"
version = "0.1.0"
description = "Modelith core: model IR, YAML round-trip, validator, round-trip/merge engine"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.6",
    "ruamel.yaml>=0.18",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdl_core"]
