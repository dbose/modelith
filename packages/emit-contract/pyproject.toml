[project]
name = "modelith-emit-contract"
version = "0.1.1"
description = "Modelith Open Data Contract Standard (ODCS v3) emitter"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["modelith-core", "ruamel.yaml>=0.18"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdl_emit_contract"]

[tool.uv.sources]
modelith-core = { workspace = true }
