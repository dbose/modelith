# Modelith project config (spec §2.2) — bundled demo model (`mdl init --demo`).
# A 7-entity investment book-of-record (IBoR): price, instrument, position,
# counterparty, transaction, portfolio, benchmark. Validates offline, renders a
# populated ERD in `mdl serve`, and generates a DuckDB warehouse you can `dbt build`.
name: pension_ibor
dbt_target: duckdb_dev
platform_targets:
  - duckdb_dev
# Ontology sources plug in by declaration (types: ols, ols-compatible, ontoportal,
# collibra, or a local file vocabulary). Left empty so the demo runs fully offline
# with no spawned resolver. To try live ontology search, add a source, e.g.:
#   ontology_stack:
#     - name: ols
#       layer: industry
#       type: ols
#       url: https://www.ebi.ac.uk/ols4/api
ontology_stack: []
naming:
  logical_case: snake
  physical_case: upper_snake
  abbreviations: {}
# How this warehouse's dbt models map back to entities, so `mdl drift` compares the
# right things. This demo warehouse materialises each entity as a staging model
# (price -> stg_price), so drift resolves entity names through a staging layer instead
# of assuming an exact name match. Add `model_map: {entity: exact_model}` for one-off
# names, or more `layers` (e.g. {name: dimension, template: "dim_{entity}"}) as the
# warehouse grows. You can also teach a mapping from the Drift panel ("Map to dbt
# model…") — it writes here.
reverse:
  layers:
    - name: staging
      prefix: stg_
