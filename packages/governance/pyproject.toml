[project]
name = "modelith-governance"
version = "0.1.0"
description = "Modelith governance: neutral GovernanceGraph, mapping DSL, adapter SPI, conformance kit"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "modelith-core",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdl_governance"]

[tool.uv.sources]
modelith-core = { workspace = true }
