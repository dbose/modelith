[project]
name = "modelith-adapter-collibra"
version = "0.1.0"
description = "Modelith Collibra governance adapter"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["modelith-governance"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdl_adapter_collibra"]

[tool.uv.sources]
modelith-governance = { workspace = true }
