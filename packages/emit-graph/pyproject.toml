[project]
name = "modelith-emit-graph"
version = "0.1.1"
description = "Modelith Neo4j / Cypher schema emitter"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["modelith-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdl_emit_graph"]

[tool.uv.sources]
modelith-core = { workspace = true }
