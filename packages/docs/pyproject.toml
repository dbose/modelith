[project]
name = "modelith-docs"
version = "0.1.0"
description = "Modelith static documentation site generator (dbt-docs style)"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["modelith-core", "modelith-emit-erd", "jinja2>=3.1.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mdl_docs"]

[tool.uv.sources]
modelith-core = { workspace = true }
modelith-emit-erd = { workspace = true }
