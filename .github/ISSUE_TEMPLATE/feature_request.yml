name: Feature request
description: Suggest a capability or improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and where does Modelith fall short today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: The capability you want. A concrete command, flag, or workflow helps.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Your team size, warehouse, and whether this blocks adoption or is a nice-to-have.
