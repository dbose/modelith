[project]
# PyPI distribution name. The bare `modelith` is taken on PyPI by an unrelated
# project, so the install name is `modelith-dbt` (install: uv tool install
# modelith-dbt). The command stays `mdl`; the import modules stay mdl_*.
name = "modelith-dbt"
version = "0.1.2"
description = "Ontology-anchored, git-native data modeling tool for dbt-core teams"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

# Single distributable wheel: all ten mdl_* module trees ship inside one
# `modelith` distribution. These are the UNION of the workspace members'
# third-party dependencies; the inter-member `modelith-*` deps are gone because
# everything now lives here. The [tool.uv.workspace] block below keeps the
# split-package layout for local development.
dependencies = [
    "pydantic>=2.6",
    "ruamel.yaml>=0.18",
    "typer>=0.12",
    "dbt-artifacts-parser>=0.5",
    "rdflib>=7.0",
    "pyshacl>=0.25",
    "jinja2>=3.1",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pygls>=2.0",
]

# Single `mdl` command. Not exposing a `modelith` script avoids colliding with
# the unrelated `modelith` package that already exists on PyPI.
[project.scripts]
mdl = "mdl_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Pull each workspace member's src/mdl_* tree into the single wheel. force-include
# maps an on-disk path to its in-wheel destination, so all ten modules land as
# top-level importable packages. The mdl_server tree carries its static/ canvas
# and SME bundle because those are real files under that directory.
[tool.hatch.build.targets.wheel]
force-include = { "packages/core/src/mdl_core" = "mdl_core", "packages/cli/src/mdl_cli" = "mdl_cli", "packages/emit-dbt/src/mdl_emit_dbt" = "mdl_emit_dbt", "packages/emit-contract/src/mdl_emit_contract" = "mdl_emit_contract", "packages/emit-pydantic/src/mdl_emit_pydantic" = "mdl_emit_pydantic", "packages/emit-graph/src/mdl_emit_graph" = "mdl_emit_graph", "packages/reverse/src/mdl_reverse" = "mdl_reverse", "packages/ontology/src/mdl_ontology" = "mdl_ontology", "packages/emit-semantic/src/mdl_emit_semantic" = "mdl_emit_semantic", "packages/governance/src/mdl_governance" = "mdl_governance", "packages/server/src/mdl_server" = "mdl_server", "packages/lsp/src/mdl_lsp" = "mdl_lsp", "packages/adapters/collibra/src/mdl_adapter_collibra" = "mdl_adapter_collibra" }

[tool.uv.workspace]
members = ["packages/*", "packages/adapters/*"]
exclude = ["packages/adapters"]

[tool.uv.sources]
modelith-core = { workspace = true }
modelith-emit-dbt = { workspace = true }
modelith-emit-contract = { workspace = true }
modelith-emit-pydantic = { workspace = true }
modelith-emit-graph = { workspace = true }
modelith-reverse = { workspace = true }
modelith-ontology = { workspace = true }
modelith-emit-semantic = { workspace = true }
modelith-governance = { workspace = true }
modelith-adapter-collibra = { workspace = true }
modelith-server = { workspace = true }
modelith-lsp = { workspace = true }
modelith-cli = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",  # FastAPI TestClient
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: typer uses call-in-default as its documented API idiom.
# UP042: str+Enum is intentional (JSON/YAML-serialisable string enums).
ignore = ["B008", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Jinja macro signatures are strings we can't line-wrap.
"packages/emit-dbt/src/mdl_emit_dbt/macros.py" = ["E501"]
# Test fixtures embed 26-char ULID literals that push lines past the limit.
"packages/*/tests/*.py" = ["E501"]

[tool.ruff.lint.isort]
# Test-local helper modules imported by bare name (added to sys.path in conftest).
known-first-party = ["mdl_core", "mdl_emit_dbt", "mdl_reverse", "mdl_cli"]
known-local-folder = ["model_builders", "manifest_fixtures", "conftest"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = "-q"
