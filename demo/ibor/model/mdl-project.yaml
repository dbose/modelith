# Modelith project config (spec §2.2)
name: pension_ibor
dbt_target: duckdb_dev
platform_targets:
  - duckdb_dev
# Ontology sources plug in by declaration. A source is either a local file vocabulary
# (default type: local) or a remote resolver browsed live for autocomplete/search
# (types: ols, ols-compatible, ontoportal, collibra). This demo uses a bundled mock
# OLS4 server (see demo_ols below + demo/ibor/ols/) so `mdl serve` shows remote
# resolution offline. To use the REAL public OLS4 instead, delete the demo_ols block
# and set the url below to https://www.ebi.ac.uk/ols4/api.
ontology_stack:
  - name: fibo-ols
    layer: industry
    type: ols
    url: http://127.0.0.1:4901/api
    prefixes:
      fibo: "https://spec.edmcouncil.org/fibo/ontology/"
# Demo convenience: mdl serve auto-spawns this mock OLS4 server (offline, no secrets).
# A real deployment omits this and points the source url at a live OLS4 instance.
demo_ols:
  script: ../ols/mock_ols.py
  host: 127.0.0.1
  port: 4901
naming:
  logical_case: snake
  physical_case: upper_snake
  abbreviations: {}
